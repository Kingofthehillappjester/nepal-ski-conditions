name: Update conditions

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecasts and build the site
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING }}
        run: python build.py
      - name: Save the daily snapshot
        run: |
          git config user.name "conditions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if ! git diff --cached --quiet; then
            git commit -m "Daily snapshot $(date -u +%F)"
            git pull --rebase --autostash && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
